<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUNDAMED · Xodimlar kirishi</title><style>body{margin:0;background:#f2f6fa;color:#17344b;font:16px system-ui}header{background:#12395d;color:white;padding:20px}main{max-width:490px;margin:45px auto;padding:0 18px}.card{background:white;border:1px solid #dae4ed;border-radius:16px;padding:26px;box-shadow:0 8px 22px #12395d12}h1{margin-top:0}label{display:block;margin:16px 0 6px}input,button{font:inherit;width:100%;box-sizing:border-box;padding:12px;border-radius:9px}input{border:1px solid #a7bac9}button{border:0;background:#086c91;color:white;cursor:pointer;margin-top:20px}.note{padding:12px;background:#fff3d4;border-radius:9px;font-size:14px}#message{min-height:24px}a{color:#086c91}</style></head><body><header><b>FUNDAMED</b> · Xodimlar kabineti</header><main><div class="card"><h1>Tizimga kirish</h1><p class="note">Sinov bosqichi. Akkauntlar faqat administrator tomonidan ochiladi. Hozircha xodimlar ro‘yxatdan o‘tkazilmagan.</p><form id="form"><label for="email">Elektron pochta</label><input id="email" type="email" autocomplete="username" required><label for="password">Parol</label><input id="password" type="password" autocomplete="current-password" required minlength="6"><button id="submit">Kirish</button></form><p id="message" role="status"></p><div id="profile" hidden></div><p><a href="./">Sinov boshqaruv paneliga qaytish</a></p></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.81.1';
const supabase=createClient('https://yqkyhetexhadcrhozgqt.supabase.co','sb_publishable_IvJCp15fLQQ6krRm_rzXLg_XYhLc0_P',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const form=document.getElementById('form'),msg=document.getElementById('message'),profile=document.getElementById('profile');
async function showProfile(){const {data:{user}}=await supabase.auth.getUser();if(!user)return;const {data,error}=await supabase.from('staff_profiles').select('display_name,role').eq('user_id',user.id).maybeSingle();if(error){msg.textContent='Profilni yuklashda xatolik yuz berdi.';return}if(!data){msg.textContent='Akkaunt mavjud, lekin kafedra ruxsati hali berilmagan.';return}form.hidden=true;profile.hidden=false;profile.replaceChildren();const p=document.createElement('p');p.textContent='Xush kelibsiz, '+data.display_name+'! Rol: '+data.role;const b=document.createElement('button');b.textContent='Chiqish';b.onclick=async()=>{await supabase.auth.signOut();location.reload()};const link=document.createElement('a');link.href='./vazifalar.html';link.textContent='Vazifalarni boshqarish paneliga o‘tish →';profile.append(p,link,document.createElement('p'),b);msg.textContent='';}
form.onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit');b.disabled=true;msg.textContent='Tekshirilmoqda...';try{const {error}=await supabase.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});document.getElementById('password').value='';if(error){msg.textContent='Kirish amalga oshmadi. Email yoki parolni tekshiring.'}else await showProfile()}catch(e){msg.textContent='Ulanish xatosi. Keyinroq urinib ko‘ring.'}finally{b.disabled=false}};showProfile();
</script></body></html>
