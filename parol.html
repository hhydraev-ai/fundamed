<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUNDAMED — Parol o‘rnatish</title><style>body{margin:0;background:#f1f5f9;color:#18384f;font:16px system-ui}header{background:#143a5d;color:white;padding:22px}main{max-width:460px;margin:40px auto;padding:0 16px}.card{background:white;padding:24px;border-radius:16px;border:1px solid #d9e3eb}label{display:block;margin:14px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:9px}input{border:1px solid #a9bccb}button{margin-top:18px;border:0;background:#08729a;color:white}button:disabled{opacity:.5}#message{margin-top:16px}a{color:#08729a}</style></head><body><header><b>FUNDAMED</b> · Akkauntni faollashtirish</header><main><div class="card"><h1>Parolni o‘rnatish</h1><p id="message" role="status">Taklif havolasi tekshirilmoqda...</p><form id="form" hidden><label for="password">Yangi parol (kamida 12 belgi)</label><input id="password" type="password" minlength="12" autocomplete="new-password" required><label for="confirm">Parolni takrorlang</label><input id="confirm" type="password" minlength="12" autocomplete="new-password" required><button id="save">Parolni saqlash</button></form><p><a href="./login.html">Kirish sahifasi</a></p></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.81.1';
const db=createClient('https://yqkyhetexhadcrhozgqt.supabase.co','sb_publishable_IvJCp15fLQQ6krRm_rzXLg_XYhLc0_P',{auth:{detectSessionInUrl:true,persistSession:true}});
const msg=document.getElementById('message'),form=document.getElementById('form');let ready=false;
async function init(){const url=new URL(location.href),token=url.searchParams.get('token_hash'),type=url.searchParams.get('type');if(token&&['invite','recovery'].includes(type)){const {error}=await db.auth.verifyOtp({token_hash:token,type});if(error){msg.textContent='Taklif havolasi yaroqsiz yoki muddati tugagan.';return}}
const {data:{user},error}=await db.auth.getUser();if(error||!user){msg.textContent='Taklif havolasi orqali kiring. Havola ishlamasa, administratordan yangi taklif so‘rang.';return}ready=true;form.hidden=false;msg.textContent='Yangi, boshqa joyda ishlatilmagan parol kiriting.';history.replaceState({},'',location.pathname)}
form.onsubmit=async e=>{e.preventDefault();if(!ready)return;const a=document.getElementById('password').value,b=document.getElementById('confirm').value;if(a!==b){msg.textContent='Parollar bir xil emas.';return}const btn=document.getElementById('save');btn.disabled=true;const {error}=await db.auth.updateUser({password:a});document.getElementById('password').value='';document.getElementById('confirm').value='';if(error){msg.textContent='Parolni saqlashda xatolik: '+error.message;btn.disabled=false;return}msg.textContent='Parol muvaffaqiyatli o‘rnatildi. Endi tizimga kirishingiz mumkin.';form.hidden=true;await db.auth.signOut();btn.disabled=false};init().catch(()=>msg.textContent='Havolani tekshirishda xatolik yuz berdi.');
</script></body></html>
