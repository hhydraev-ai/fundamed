<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUNDAMED · Jamoa</title><style>body{margin:0;font:16px system-ui;background:#f3f6fa;color:#17304a}header{background:#12395d;color:#fff;padding:20px}header a{color:#fff}main{max-width:950px;margin:30px auto;padding:0 18px}.card{background:white;border:1px solid #dde5ed;border-radius:14px;padding:22px;margin:18px 0}.notice{background:#fff3cf;padding:16px;border-radius:12px}form{display:grid;grid-template-columns:2fr 1fr auto;gap:10px}input,select,button{font:inherit;padding:11px;border:1px solid #aabacb;border-radius:8px}button{background:#086c91;color:white;cursor:pointer;border:0}.person{padding:14px 0;border-bottom:1px solid #e1e8f0;display:flex;justify-content:space-between;gap:12px}.person small{display:block;color:#6b7d90}h1{margin-bottom:8px}@media(max-width:650px){form{grid-template-columns:1fr}.person{flex-direction:column}}</style></head><body><header><strong>FUNDAMED</strong> · <a href="./">Boshqaruv paneli</a></header><main><h1>Jamoa ro‘yxati</h1><p>Sinov versiyasi · o‘qituvchilar va mas’ullar bo‘limi</p><div class="notice"><b>Diqqat:</b> Bu haqiqiy xodimlar bazasi emas. Ma’lumotlar faqat shu brauzerda saqlanadi. Haqiqiy shaxsiy ma’lumotlarni kiritmang.</div><section class="card"><h2>Namuna xodim qo‘shish</h2><form id="f"><input id="name" required maxlength="90" placeholder="Ism yoki sinov nomi"><select id="role"><option>O‘qituvchi</option><option>Koordinator</option><option>Mudir o‘rinbosari</option><option>Kafedra mudiri</option></select><button>Qo‘shish</button></form></section><section class="card"><h2>Jamoa <span id="count"></span></h2><div id="people"></div></section></main><script>const key='fundamed-demo-staff-v1';let people=[];try{people=JSON.parse(localStorage.getItem(key))||[]}catch(e){}if(!Array.isArray(people))people=[];function render(){document.getElementById('count').textContent='('+people.length+')';const root=document.getElementById('people');root.replaceChildren();if(!people.length){const p=document.createElement('p');p.textContent='Hozircha namuna xodim yo‘q.';root.append(p)}people.forEach(person=>{const row=document.createElement('div');row.className='person';const div=document.createElement('div');const name=document.createElement('strong');name.textContent=person.name;const role=document.createElement('small');role.textContent=person.role;div.append(name,role);const btn=document.createElement('button');btn.textContent='O‘chirish';btn.onclick=()=>{people=people.filter(x=>x.id!==person.id);save()};row.append(div,btn);root.append(row)})}function save(){localStorage.setItem(key,JSON.stringify(people));render()}document.getElementById('f').onsubmit=e=>{e.preventDefault();people.push({id:crypto.randomUUID(),name:document.getElementById('name').value.trim(),role:document.getElementById('role').value});save();e.target.reset()};render()</script></body></html>
