name: Testlar
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run test:sql
      - name: Brauzer testlari
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Maxfiy kalitlar tekshiruvi
        run: |
          if git grep -nE "sb_secret_[A-Za-z0-9_]{10,}|service_role\"?\s*[:=]|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}" -- ':!vendor/*' ':!package-lock.json'; then
            echo "Repozitoriyada maxfiy kalitga o'xshash satr topildi!"; exit 1; fi
