<!doctype html><html lang="uz"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://yqkyhetexhadcrhozgqt.supabase.co wss://yqkyhetexhadcrhozgqt.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer"><link rel="stylesheet" href="./assets/app.css">

<title>FUNDAMED — Vazifalar</title></head><body>
<header class="top"><div class="brand">FUNDAMED · Vazifalar<small>OXU · Fundamental tibbiyot kafedrasi</small></div><nav id="nav"></nav></header>
<main><h1>Umumiy vazifalar paneli</h1><p id="status" class="status" role="status">Tizim tekshirilmoqda...</p>
<section id="app" hidden><p id="who" class="muted"></p>
<div class="card" id="createBox" hidden><h2>Yangi vazifa</h2><form id="createForm"><label for="title">Vazifa nomi</label><input id="title" maxlength="200" required>
<label for="description">Izoh</label><textarea id="description" rows="3" maxlength="4000"></textarea>
<div class="grid"><div><label for="assignee">Mas’ul xodim</label><select id="assignee"><option value="">Hozircha biriktirilmagan</option></select></div>
<div><label for="due">Muddat</label><input id="due" type="date"></div>
<div><label for="priority">Ustuvorlik</label><select id="priority"><option value="normal">Oddiy</option><option value="important">Muhim</option><option value="urgent">Shoshilinch</option></select></div></div>
<p><button id="createBtn">Vazifani saqlash</button></p></form></div>
<div class="card" id="editArea" hidden><h2>Vazifani tahrirlash</h2><form id="editForm"><input id="editId" type="hidden">
<label for="editTitle">Vazifa nomi</label><input id="editTitle" maxlength="200" required>
<label for="editDescription">Izoh</label><textarea id="editDescription" maxlength="4000"></textarea>
<label for="editAssignee">Mas’ul</label><select id="editAssignee"></select>
<label for="editDue">Muddat</label><input type="date" id="editDue">
<label for="editPriority">Ustuvorlik</label><select id="editPriority"><option value="normal">Oddiy</option><option value="important">Muhim</option><option value="urgent">Shoshilinch</option></select>
<div class="row" style="margin-top:15px"><button id="saveEdit">O‘zgarishlarni saqlash</button><button type="button" id="cancelEdit" class="secondary">Bekor qilish</button></div></form></div>
<div class="card"><h2>Vazifalar statistikasi</h2><div id="stats" class="grid"></div></div>
<div class="card"><h2>Tezkor tahlil</h2><p class="muted">Qoidaviy tahlil: ma’lumot tashqi xizmatga yuborilmaydi, vazifalar o‘zgartirilmaydi.</p>
<button id="analyze" class="secondary">Vazifalarni tahlil qilish</button><div id="analysis" class="pre" style="margin-top:12px" role="status"></div></div>
<div class="card"><div class="row between"><h2>Vazifalar ro‘yxati</h2><button id="refresh" class="secondary">Yangilash</button></div>
<div class="row"><select id="filter" aria-label="Holat bo‘yicha saralash"><option value="all">Barchasi</option><option value="new">Yangi</option><option value="in_progress">Jarayonda</option><option value="done">Bajarilgan</option><option value="cancelled">Bekor qilingan</option><option value="overdue">Muddati o‘tgan</option></select>
<input id="search" type="search" placeholder="Nomi yoki izoh bo‘yicha qidirish" aria-label="Qidirish"></div>
<div id="tasks"></div></div></section></main>
<script type="module" src="./js/pages/vazifalar.js"></script></body></html>
