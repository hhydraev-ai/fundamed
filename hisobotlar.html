<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUNDAMED — Hisobotlar</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#18364b;font:16px system-ui}header{background:#143a5d;color:#fff;padding:20px}header a{color:white}main{max-width:1080px;margin:25px auto;padding:0 18px}.card{background:#fff;border:1px solid #dce5ed;border-radius:14px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.number{font-size:30px;font-weight:800;color:#08729a}button{background:#08729a;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer;margin:5px}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #dce5ed}#summary{white-space:pre-line;line-height:1.6}small{color:#63798a}@media print{header,button{display:none}body{background:white}.card{break-inside:avoid}}</style></head><body><header><b>FUNDAMED · Hisobotlar</b>　<a href="./vazifalar.html">Vazifalar paneliga qaytish</a></header><main><h1>Kafedra vazifalari hisoboti</h1><p id="status">Ma’lumotlar yuklanmoqda...</p><div id="app" hidden><p id="who"></p><div id="stats" class="grid"></div><div class="card"><h2>Xodimlar bo‘yicha</h2><div style="overflow-x:auto"><table><thead><tr><th>Xodim</th><th>Jami</th><th>Bajarilgan</th><th>Kechikkan</th></tr></thead><tbody id="staffRows"></tbody></table></div></div><div class="card"><h2>Avtomatik hisobot yordamchisi</h2><small>Bu bepul qoidaviy tahlil, generativ AI emas. Ma’lumot tashqi AI xizmatiga yuborilmaydi.</small><p id="summary"></p><button id="copy">Hisobot matnini nusxalash</button><button id="csv">CSV / Excel uchun yuklash</button><button id="print">PDF uchun chop etish</button></div></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.81.1';
const db=createClient('https://yqkyhetexhadcrhozgqt.supabase.co','sb_publishable_IvJCp15fLQQ6krRm_rzXLg_XYhLc0_P'),$=id=>document.getElementById(id);
const el=(tag,text)=>{const n=document.createElement(tag);n.textContent=String(text);return n};
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const overdue=t=>!!t.due_date&&t.due_date<today()&&!['done','cancelled'].includes(t.status);
async function init(){
 const {data:{user},error}=await db.auth.getUser();if(error||!user){location.replace('./login.html');return}
 const p=await db.from('staff_profiles').select('display_name,role').eq('user_id',user.id).maybeSingle();
 if(p.error||!p.data){$('status').textContent='Kafedra profili topilmadi.';return}
 $('who').textContent='Foydalanuvchi: '+p.data.display_name+' · Rol: '+p.data.role;
 const [tasks,profiles]=await Promise.all([db.from('department_tasks').select('title,status,due_date,assignee_id,priority').order('created_at',{ascending:false}).limit(1000),db.from('staff_profiles').select('user_id,display_name')]);
 if(tasks.error){$('status').textContent='Vazifalarni olishda xatolik: '+tasks.error.message;return}
 if(profiles.error){$('status').textContent='Xodimlarni olishda xatolik: '+profiles.error.message;return}
 const data=tasks.data||[],people=profiles.data||[],name=id=>people.find(x=>x.user_id===id)?.display_name||(id?'Xodim':'Biriktirilmagan');
 const metrics=[['Jami',data.length],['Yangi',data.filter(x=>x.status==='new').length],['Jarayonda',data.filter(x=>x.status==='in_progress').length],['Bajarilgan',data.filter(x=>x.status==='done').length],['Kechikkan',data.filter(overdue).length]];
 for(const [label,value] of metrics){const c=el('div','');c.className='card';c.append(el('small',label));const v=el('div',value);v.className='number';c.append(v);$('stats').append(c)}
 const names=[...new Set([...people.map(x=>x.display_name),...data.map(x=>name(x.assignee_id))])].sort((a,b)=>a.localeCompare(b));
 for(const n of names){const subset=data.filter(x=>name(x.assignee_id)===n);if(!subset.length)continue;const tr=document.createElement('tr');for(const v of [n,subset.length,subset.filter(x=>x.status==='done').length,subset.filter(overdue).length])tr.append(el('td',v));$('staffRows').append(tr)}
 const late=data.filter(overdue),urgent=data.filter(x=>x.priority==='urgent'&&x.status!=='done'&&x.status!=='cancelled');
 const report=['FUNDAMED — kafedra vazifalari hisoboti','Sana: '+today(),'Jami vazifalar: '+data.length,'Bajarilgan: '+data.filter(x=>x.status==='done').length,'Jarayonda: '+data.filter(x=>x.status==='in_progress').length,'Muddati o‘tgan: '+late.length,'Shoshilinch ochiq vazifalar: '+urgent.length,late.length?'E’tibor talab qiladigan vazifalar: '+late.slice(0,10).map(x=>x.title).join('; '):'Hozir muddati o‘tgan vazifa aniqlanmadi.','Eslatma: hisobot faqat ushbu akkaunt ko‘rishga ruxsatli vazifalarni qamrab oladi.'].join('\n');
 $('summary').textContent=report;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report);$('status').textContent='Hisobot nusxalandi.'}catch{$('status').textContent='Nusxalash amalga oshmadi.'}};
 $('print').onclick=()=>window.print();
 $('csv').onclick=()=>{const rows=[['Vazifa','Holat','Masul','Muddat','Ustuvorlik'],...data.map(x=>[x.title,x.status,name(x.assignee_id),x.due_date||'',x.priority||'normal'])];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""').replace(/^[=+@\-\t\r]/,'\u0027$&')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fundamed-hisobot.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
 $('app').hidden=false;$('status').textContent='Hisobot tayyor. Ko‘rsatilgan vazifalar: '+data.length
}init().catch(e=>$('status').textContent='Hisobotni yuklashda xatolik: '+e.message);
</script></body></html>
